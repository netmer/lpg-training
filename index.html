<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation สถานีโรงบรรจุก๊าซ LPG</title>
<style>
  @font-face{font-family:'ThaiUI';src:local('Sarabun'),local('Leelawadee UI'),local('Tahoma');font-display:swap}
</style>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<!-- Top bar (slim) -->
<header class="ppt-header">
  <div class="brand">
    <div class="brand-mark">⛽</div>
    <div class="title-block">
      <h1>Animation • สถานีโรงบรรจุก๊าซ LPG</h1>
    </div>
    <div class="toolbar">
      <button class="icon-btn" id="ovPause"      title="หยุด / เล่น (Space)">⏸ Pause</button>
      <button class="icon-btn" id="btnFullscreen" title="เต็มจอ (F)">⛶ Full</button>
    </div>
  </div>

  <!-- Process steps banner (7 stages of LPG bottling) -->
  <div class="process-banner" id="processBanner">
    <div class="process-step"><span class="num">1</span><span class="label">ตรวจสภาพถัง</span></div>
    <span class="flow-arrow">›</span>
    <div class="process-step"><span class="num">2</span><span class="label">ชั่งน้ำหนักถังเปล่า</span></div>
    <span class="flow-arrow">›</span>
    <div class="process-step"><span class="num">3</span><span class="label">อัด LPG เข้าถัง</span></div>
    <span class="flow-arrow">›</span>
    <div class="process-step"><span class="num">4</span><span class="label">ชั่งซ้ำหลังบรรจุ</span></div>
    <span class="flow-arrow">›</span>
    <div class="process-step"><span class="num">5</span><span class="label">ทดสอบรอยรั่ว</span></div>
    <span class="flow-arrow">›</span>
    <div class="process-step"><span class="num">6</span><span class="label">ปิดซีล + อุปกรณ์</span></div>
    <span class="flow-arrow">›</span>
    <div class="process-step"><span class="num">7</span><span class="label">จัดจำหน่าย</span></div>
  </div>
</header>

<!-- Main stage (fills viewport) -->
<main class="ppt-main">
  <section class="scene active" data-scene="overview">
    <div class="stage" id="stageOverview"><!-- populated by scene1.js --></div>
  </section>
</main>

<!-- Scripts -->
<script src="./js/app.js"></script>
<script src="./js/scene1.js"></script>

</body>
</html>
